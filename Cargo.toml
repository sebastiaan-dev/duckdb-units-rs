[workspace]
members = ["crates/engine", "crates/core", "crates/native", "crates/wasm"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
duckdb-neo = { version = "=0.20000.1", features = ["build-extension"] }
units_core = { path = "crates/core" }
units_engine = { path = "crates/engine" }

[profile.release]
lto = true
strip = true
